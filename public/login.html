<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Degree Progress</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
<div class="auth-page">
  <form id="loginForm" class="auth-card">
    <span class="topbar-logo" aria-hidden="true" style="margin: 0 auto 6px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
    </span>
    <h1>Degree Progress</h1>
    <p class="muted auth-sub">Sign in to view your dashboard</p>

    <label>Enrollment Number
      <input id="enrolment" type="text" inputmode="numeric" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <p id="authError" class="auth-error" hidden></p>

    <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">Sign In</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  (async function redirectIfSignedIn() {
    const session = await getSession();
    if (session) window.location.href = 'index.html';
  })();

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const enrolment = document.getElementById('enrolment').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await signIn(enrolment, password);

    if (error) {
      errorEl.textContent = 'Incorrect enrollment number or password.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    window.location.href = 'index.html';
  });
</script>
</body>
</html>
