<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Degree Progress</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
<div class="auth-page">
  <form id="loginForm" class="auth-card">
    <span class="topbar-logo" aria-hidden="true" style="margin: 0 auto 6px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
    </span>
    <h1>Degree Progress</h1>
    <p class="muted auth-sub">Sign in to view your dashboard</p>

    <label>Enrollment Number
      <input id="enrolment" type="text" inputmode="numeric" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <span class="input-with-action">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePassword" class="input-action-btn" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.4 21.4 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a21.4 21.4 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </span>
    </label>

    <p id="authError" class="auth-error" hidden></p>

    <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">Sign In</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  (async function redirectIfSignedIn() {
    const session = await getSession();
    if (session) window.location.href = 'index.html';
  })();

  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  toggleBtn.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    toggleBtn.classList.toggle('is-active', !showing);
    toggleBtn.setAttribute('aria-pressed', String(!showing));
    toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const enrolment = document.getElementById('enrolment').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await signIn(enrolment, password);

    if (error) {
      errorEl.textContent = 'Incorrect enrollment number or password.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    window.location.href = 'index.html';
  });
</script>
</body>
</html>
