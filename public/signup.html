<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Degree Progress</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
<div class="auth-page">
  <form id="signupForm" class="auth-card">
    <span class="topbar-logo" aria-hidden="true" style="margin: 0 auto 6px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
    </span>
    <h1>Create Account</h1>
    <p class="muted auth-sub">For IGNOU BCAOL students — enter your enrollment number and choose a password</p>

    <label>Enrollment Number
      <input id="enrolment" type="text" inputmode="numeric" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <span class="input-with-action">
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>
        <button type="button" id="togglePassword" class="input-action-btn" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.4 21.4 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a21.4 21.4 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </span>
    </label>
    <label>Confirm Password
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
    </label>
    <p class="muted auth-note">There's no email on file, so there's no "forgot password" link — if you lose it, you'll need to ask an admin to reset it.</p>

    <p id="authError" class="auth-error" hidden></p>

    <button type="submit" class="btn btn-primary auth-submit" id="submitBtn">Create Account</button>
    <p class="muted auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  (async function redirectIfSignedIn() {
    const session = await getSession();
    if (session) window.location.href = 'index.html';
  })();

  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  toggleBtn.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    toggleBtn.classList.toggle('is-active', !showing);
    toggleBtn.setAttribute('aria-pressed', String(!showing));
    toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  const form = document.getElementById('signupForm');
  const errorEl = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;

    const enrolment = document.getElementById('enrolment').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!/^\d+$/.test(enrolment)) {
      errorEl.textContent = 'Enrollment number should contain digits only.';
      errorEl.hidden = false;
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    const { data, error } = await signUpWithEnrolment(enrolment, password);

    if (error) {
      errorEl.textContent = /registered|exists/i.test(error.message)
        ? 'An account for this enrollment number already exists — try signing in instead.'
        : error.message;
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      return;
    }

    if (!data.session) {
      // Shouldn't happen with email confirmation turned off, but handle it
      // gracefully rather than leaving the user stuck on this page.
      errorEl.textContent = 'Account created — please sign in.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      return;
    }

    window.location.href = 'index.html';
  });
</script>
</body>
</html>
